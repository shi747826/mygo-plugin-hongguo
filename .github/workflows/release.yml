name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  darwin-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify tag and manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 -c 'import json,os; assert "v"+json.load(open("plugin.json"))["version"] == os.environ["TAG"]'
      - name: Test and vet
        env:
          GOWORK: 'off'
        run: |
          go test -race ./...
          go vet ./...
      - name: Build signed package
        env:
          GOOS: darwin
          GOARCH: arm64
        run: ./scripts/build.sh
      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/hongguo-darwin-arm64.zip --clobber
